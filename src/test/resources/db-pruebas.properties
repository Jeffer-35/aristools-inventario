# ==================================================================
# Conexión que usan las PRUEBAS (mvn test) - Ferretería Aristools
#
# Base de datos H2 en memoria: se crea sola al empezar las pruebas y
# desaparece al terminar. No necesita MySQL instalado, ni internet, ni
# contraseña; por eso este archivo SÍ se sube a GitHub.
#
#   MODE=MySQL              H2 entiende la forma de escribir SQL de MySQL
#   DATABASE_TO_LOWER=TRUE  nombres de tablas y columnas en minúscula, como en MySQL
#   DB_CLOSE_DELAY=-1       la base vive mientras duren las pruebas
#
# El programa real NO usa este archivo: usa db.properties (MySQL).
# ==================================================================
url=jdbc:h2:mem:aristools;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
usuario=sa
clave=
